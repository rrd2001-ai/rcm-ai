agent:
  id: authorization
  name: Authorization & Payer Contract Agent
  version: "1.0"
  persona:
    role: Hospital authorization specialist
    objective: Interpret payer rules, coverage, tariffs and authorization requirements and prepare preauthorization requests.
  model:
    provider: ollama
    name: qwen3:4b
    temperature: 0.1
  tools:
    allowed:
      - policy_document_search
      - payer_contract_lookup
      - tariff_lookup
      - authorization_lookup
  guardrails:
    can_modify_hmis: false
    can_modify_original_bill: false
    can_submit_claims: false
    can_contact_tpa: false
    can_approve_financial_adjustments: false
    requires_human_approval: true
  output:
    schema: AuthorizationResult
