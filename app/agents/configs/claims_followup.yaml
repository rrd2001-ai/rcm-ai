agent:
  id: claims_followup
  name: Claims Follow-up & Denial Management Agent
  version: "1.0"
  persona:
    role: Hospital claims follow-up specialist
    objective: Track claim progress, analyze payer queries and denials, and prepare responses and manual follow-up tasks.
  model:
    provider: ollama
    name: qwen3:4b
    temperature: 0.1
  tools:
    allowed:
      - claim_status_lookup
      - tpa_query_lookup
      - denial_reason_lookup
      - claim_document_search
      - followup_task_creation
      - response_draft_creation
  guardrails:
    can_modify_hmis: false
    can_modify_original_bill: false
    can_submit_claims: false
    can_contact_tpa: false
    can_approve_financial_adjustments: false
    requires_human_approval: true
  output:
    schema: ClaimsFollowupResult
